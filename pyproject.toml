[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tallylock"
version = "0.1.0a3"
description = "Standalone evaluation receipts with independently checkable artifact and timestamp evidence"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "Christopher Ayers"}]
dependencies = ["rfc8785==0.1.4", "opentimestamps==0.5.0", "python-bitcoinlib==0.12.2", "jsonschema==4.26.0",
                "pycryptodomex==3.24.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
tallylock = "tallylock.cli:main"

[project.urls]
Repository = "https://github.com/TriplePassLabs/tallylock"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tallylock = ["data/schemas/*.json", "data/conformance/*.json", "data/conformance/*.md",
         "data/conformance/cases/*.json", "data/examples/basic/*.json",
         "data/examples/basic/*.md", "data/examples/basic/outputs/*", "data/tsa/*", "data/agent-guide.md",
         "data/difficulty.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
